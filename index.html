<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>G Nithya Shri | Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />

  <style>
    :root {
      --cyan: #22d3ee;
      --blue: #6366f1;
      --pink: #f472b6;
      --bg: #05070f;
      --surface: rgba(255,255,255,0.03);
      --border: rgba(255,255,255,0.07);
      --text: #f1f5f9;
      --muted: #64748b;
      --card-glow: rgba(34,211,238,0.06);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      line-height: 1.65;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }

    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 48px;
      background: rgba(5,7,15,0.7);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .nav-logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.1rem;
      background: linear-gradient(90deg, var(--cyan), var(--blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-decoration: none;
      letter-spacing: -0.5px;
    }

    .nav-links {
      display: flex;
      gap: 36px;
      list-style: none;
    }

    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .nav-links a:hover { color: var(--cyan); }

    #hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 120px 10vw 80px;
      position: relative;
    }

    #hero::after {
      content: '';
      position: absolute;
      width: 700px; height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(34,211,238,0.08) 0%, transparent 70%);
      top: -100px; right: -200px;
      pointer-events: none;
    }

    .hero-label {
      font-size: 0.8rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--cyan);
      font-weight: 600;
      margin-bottom: 20px;
      opacity: 0;
      animation: slideUp 0.6s 0.1s ease forwards;
    }

    .hero-name {
      font-family: 'Syne', sans-serif;
      font-size: clamp(3.5rem, 9vw, 7rem);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -3px;
      color: #fff;
      opacity: 0;
      animation: slideUp 0.7s 0.2s ease forwards;
    }

    .hero-name span {
      display: block;
      background: linear-gradient(135deg, var(--cyan) 0%, var(--blue) 50%, var(--pink) 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientShift 5s linear infinite, slideUp 0.7s 0.3s ease forwards;
      opacity: 0;
    }

    @keyframes gradientShift {
      0% { background-position: 0% center; }
      50% { background-position: 100% center; }
      100% { background-position: 0% center; }
    }

    .hero-sub {
      margin-top: 28px;
      font-size: 1.15rem;
      color: #94a3b8;
      font-weight: 300;
      max-width: 520px;
      line-height: 1.7;
      opacity: 0;
      animation: slideUp 0.7s 0.45s ease forwards;
    }

    .hero-badges {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 28px;
      opacity: 0;
      animation: slideUp 0.7s 0.55s ease forwards;
    }

    .badge {
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      border: 1px solid rgba(34,211,238,0.25);
      color: var(--cyan);
      background: rgba(34,211,238,0.06);
    }

    .badge.blue {
      border-color: rgba(99,102,241,0.3);
      color: #a5b4fc;
      background: rgba(99,102,241,0.07);
    }

    .hero-actions {
      display: flex;
      gap: 14px;
      margin-top: 44px;
      flex-wrap: wrap;
      opacity: 0;
      animation: slideUp 0.7s 0.65s ease forwards;
    }

    .btn {
      padding: 14px 30px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.25s ease;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      color: #fff;
      border: none;
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px -6px rgba(34,211,238,0.35);
    }

    .btn-ghost {
      background: transparent;
      color: #cbd5e1;
      border: 1px solid var(--border);
    }

    .btn-ghost:hover {
      border-color: var(--cyan);
      color: var(--cyan);
      transform: translateY(-3px);
      background: rgba(34,211,238,0.04);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .scroll-hint {
      position: absolute;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 0.7rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      animation: bounce 2s ease infinite;
    }

    .scroll-hint svg { width: 18px; height: 18px; }

    @keyframes bounce {
      0%,100% { transform: translateX(-50%) translateY(0); }
      50%      { transform: translateX(-50%) translateY(6px); }
    }

    section { position: relative; z-index: 1; }

    .container {
      max-width: 1160px;
      margin: 0 auto;
      padding: 100px 48px;
    }

    .section-tag {
