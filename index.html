<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G Nithya Shri | Portfolio</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #06b6d4;
            --secondary: #3b82f6;
            --bg: #020617;
            --card-bg: rgba(15, 23, 42, 0.55);
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { 
            box-sizing: border-box; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            scroll-behavior: smooth; 
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(6, 182, 212, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 100% 50%, rgba(59, 130, 246, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 50% 100%, #1e293b 0%, #020617 80%);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 24px;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        header h1 {
            font-size: clamp(2.8rem, 9vw, 5rem);
            margin: 0 0 16px 0;
            background: linear-gradient(135deg, #22d3ee, #3b82f6, #818cf8);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: -2px;
            animation: textGradient 6s linear infinite;
        }

        @keyframes textGradient {
            0% { background-position: 0% center; }
            50% { background-position: 100% center; }
            100% { background-position: 0% center; }
        }

        .cta-container { display: flex; gap: 16px; margin-top: 32px; }

        .btn {
            padding: 14px 28px;
            border-radius: 10px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; border: none; }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 10px 25px -5px rgba(6, 182, 212, 0.4); }

        .btn-outline { 
            background: transparent; 
            color: #fff; 
            border: 1px solid rgba(255, 255, 255, 0.15); 
        }

        .btn-outline:hover { 
            background: rgba(255, 255, 255, 0.05); 
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-3px); 
        }

        .section { 
            padding: 90px 24px; 
            max-width: 1200px; 
            margin: auto; 
            animation: fadeInUp 1s ease-out; 
        }

        h2 {
            font-size: 2.4rem;
            border-left: 5px solid var(--primary);
            padding-left: 16px;
            margin-bottom: 45px;
            letter-spacing: -0.5px;
            font-weight: 700;
        }

        .about-box {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
        }

        .cert-badges {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .cert-badge {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.15), rgba(59, 130, 246, 0.15));
            border: 1px solid rgba(6, 182, 212, 0.3);
            color: #e2e8f0;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .project-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 32px;
        }

        @media (max-width: 850px) {
            .project-grid { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 32px;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            box-shadow: 0 15px 35px -15px rgba(0,0,0,0.6);
        }

        .card:hover { 
            border-color: rgba(6, 182, 212, 0.35); 
            transform: translateY(-6px); 
            box-shadow: 0 25px 50px -15px rgba(6, 182, 212, 0.2);
        }

        .card-content { flex-grow: 1; }

        .card h3 {
            margin-top: 0;
            font-size: 1.45rem;
            color: #fff;
            font-weight: 700;
        }

        .card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 16px;
        }

        .image-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 12px; 
            margin-top: 24px; 
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.08); 
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .image-container img { 
            width: 100%; 
            height: 100%;
            object-fit: cover;
            object-position: top center;
            display: block;
        }

        .project-links {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .project-links a {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.04);
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .project-links a:hover {
            background: rgba(6, 182, 212, 0.12);
            color: var(--primary);
            border-color: var(--primary);
            transform: translateY(-1px);
        }

        .skills-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .skills-grid span {
            background: rgba(30, 41, 59, 0.4);
            color: #cbd5e1;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 500;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .skills-grid span:hover {
            color: var(--primary);
            border-color: rgba(6, 182, 212, 0.3);
            background: rgba(6, 182, 212, 0.08);
            transform: translateY(-2px);
        }

        .contact-container {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
        }

        .contact-row {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 16px 0;
            font-size: 1.05rem;
        }
        .contact-row:first-child { margin-top: 0; }
        .contact-row:last-child { margin-bottom: 0; }

        .contact-label { color: var(--text-muted); min-width: 90px; font-weight: 500; }

        .contact-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            word-break: break-all;
        }
        .contact-link:hover { text-decoration: underline; color: var(--secondary); }

        footer { 
            text-align: center; 
            padding: 50px 24px; 
            color: #475569; 
            font-size: 0.9rem;
            border-top: 1px solid rgba(255,255,255,0.03); 
        }
    </style>
</head>
